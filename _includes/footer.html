<div class="footer">
  <div class="social-links">
    {% for item in site.data.settings.social %}
    <a href="{{ item.link }}" target="_blank" aria-label="{{ item.icon }}">
      <i class="fab fa-{{ item.icon }}"></i>
    </a>
    {% endfor %}
  </div>
  <div>
    &copy; {{ "now" | date: "%Y" }} {{ site.title }}. All rights reserved.
  </div>
</div>
